<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahayog — Your journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-dark:#0A4F4B; --teal:#0F6B66; --teal-soft:#E4F0EE;
    --aqua:#4FB3A9; --gold:#F7C948; --gold-soft:#FCEBB6;
    --coral:#EF7B45; --cream:#FBF8F2; --ink:#20302C; --ink-soft:#4B5C57; --white:#FFFFFF;
    --border:#E7E1D3; --danger:#C2703A; --shadow:0 4px 14px rgba(15,107,102,0.08);
    --fs-base:16px;
  }
  html.a11y-large{ --fs-base:19px; }
  html.a11y-contrast{ --teal:#00504A; --teal-dark:#003532; --coral:#C2500F; --ink:#000000; --ink-soft:#242424; --border:#8a8a8a; --cream:#FFFFFF; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{font-size:var(--fs-base);}
  body{font-family:'Mukta',sans-serif; background:var(--cream); color:var(--ink); line-height:1.5; padding-bottom:100px; font-size:1rem;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--teal-dark); line-height:1.2;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:800px; margin:0 auto; padding:0 20px;}
  .fine{font-size:0.8rem;}

  /* ---- top bar ---- */
  .topbar{background:var(--white); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:40;}
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 20px; max-width:800px; margin:0 auto; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:8px;}
  .brand svg{width:32px; height:32px;}
  .brand span{font-family:'Baloo 2'; font-weight:800; font-size:1.1rem; color:var(--teal-dark);}
  .topbar-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .lang-switch{display:flex; background:var(--teal-soft); border-radius:999px; padding:3px; gap:2px;}
  .lang-switch button{border:none; background:transparent; color:var(--teal-dark); font-weight:600; font-size:0.8rem; padding:7px 13px; border-radius:999px;}
  .lang-switch button.active{background:var(--teal); color:var(--white);}
  .icon-toggle{width:38px; height:38px; border-radius:50%; border:1.5px solid var(--border); background:var(--white); display:flex; align-items:center; justify-content:center; color:var(--teal-dark);}
  .icon-toggle svg{width:18px; height:18px;}
  .icon-toggle.active{background:var(--teal-soft); border-color:var(--teal);}

  /* ---- accessibility panel ---- */
  .a11y-panel{display:none; position:fixed; top:64px; right:20px; background:var(--white); border:1px solid var(--border); border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,0.18); padding:14px; z-index:60; width:230px;}
  .a11y-panel.open{display:block;}
  .a11y-panel h4{font-size:0.85rem; margin-bottom:10px; color:var(--teal-dark);}
  .a11y-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; font-size:0.85rem; border-bottom:1px solid var(--border);}
  .a11y-row:last-child{border-bottom:none;}
  .switch{width:38px; height:22px; border-radius:999px; background:var(--border); position:relative; border:none; flex:none;}
  .switch.on{background:var(--teal);}
  .switch::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--white); transition:transform 0.15s;}
  .switch.on::after{transform:translateX(16px);}

  /* ---- step tracker ---- */
  .tracker{background:var(--white); border-bottom:1px solid var(--border); overflow-x:auto;}
  .tracker-inner{display:flex; gap:6px; padding:12px 20px; max-width:800px; margin:0 auto; min-width:max-content;}
  .tstep{display:flex; align-items:center; gap:6px; flex:none;}
  .tstep .dot{width:26px; height:26px; border-radius:50%; background:var(--teal-soft); color:var(--teal-dark); display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700; flex:none;}
  .tstep.done .dot{background:var(--teal); color:var(--white);}
  .tstep.active .dot{background:var(--coral); color:var(--white);}
  .tstep .label{font-size:0.72rem; color:var(--ink-soft); font-weight:600; white-space:nowrap;}
  .tstep.active .label{color:var(--teal-dark);}
  .tstep .line{width:16px; height:2px; background:var(--border); flex:none;}

  /* ---- content ---- */
  .screen{padding:36px 20px 20px; max-width:800px; margin:0 auto;}
  .eyebrow{font-size:0.8rem; font-weight:700; color:var(--coral); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:8px;}
  .screen h2{font-size:1.6rem; margin-bottom:8px;}
  .screen .sub{color:var(--ink-soft); font-size:0.94rem; margin-bottom:26px; max-width:56ch;}

  .card{background:var(--white); border:1px solid var(--border); border-radius:16px; padding:22px; box-shadow:var(--shadow);}

  .btn{display:inline-flex; align-items:center; gap:8px; border-radius:14px; padding:13px 22px; font-weight:700; font-size:0.92rem; border:2px solid transparent;}
  .btn-primary{background:var(--coral); color:var(--white); box-shadow:0 5px 0 #C25E2C;}
  .btn-primary:active{transform:translateY(3px); box-shadow:0 2px 0 #C25E2C;}
  .btn-outline{background:var(--white); color:var(--teal-dark); border-color:var(--teal);}
  .btn-ghost{background:var(--teal-soft); color:var(--teal-dark); border-color:transparent;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn svg{width:18px; height:18px;}
  .btn-row{display:flex; flex-wrap:wrap; gap:10px;}

  /* ---- landing (step 0) ---- */
  .landing-hero{position:relative; text-align:center; padding:20px 0 8px; overflow:hidden; border-radius:20px;}
  .landing-hero .netbg{position:absolute; inset:0; z-index:0; opacity:0.5;}
  .landing-hero .content{position:relative; z-index:1;}
  .landing-hero h2{font-size:2rem; max-width:18ch; margin:0 auto 12px;}
  .landing-hero .sub{margin:0 auto 22px;}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:28px;}
  .stat-card{background:var(--white); border:1px solid var(--border); border-radius:14px; padding:16px 8px; text-align:center; box-shadow:var(--shadow);}
  .stat-card .n{font-family:'Baloo 2'; font-weight:800; font-size:1.3rem; color:var(--teal-dark);}
  .stat-card .l{font-size:0.7rem; color:var(--ink-soft); font-weight:600; margin-top:2px;}
  .proto-tag{font-size:0.65rem; color:var(--coral); font-weight:700; margin-top:22px;}
  @media (max-width:560px){.stat-grid{grid-template-columns:1fr 1fr;}}

  /* ---- assessment ---- */
  .field{margin-bottom:22px;}
  .field > label{display:block; font-weight:700; font-size:0.95rem; margin-bottom:10px; color:var(--teal-dark);}
  .field input[type=text], .field textarea{width:100%; border:1.5px solid #DDD3BC; border-radius:12px; padding:13px 16px; font-size:0.95rem; font-family:'Mukta'; outline:none;}
  .field textarea{min-height:90px; resize:vertical;}
  .field input:focus, .field textarea:focus{border-color:var(--teal);}
  .mic-row{display:flex; gap:10px; align-items:center;}
  .loc-picker-row{display:flex; gap:10px;}
  .loc-select{flex:1; border:1.5px solid #DDD3BC; border-radius:12px; padding:12px 14px; font-size:0.9rem; font-family:'Mukta'; background:var(--white); color:var(--ink);}
  .loc-select:focus{border-color:var(--teal);}
  .mic-row input{flex:1;}
  .mic-btn{width:44px; height:44px; border-radius:50%; border:none; background:var(--teal-soft); color:var(--teal-dark); display:flex; align-items:center; justify-content:center; flex:none;}
  .mic-btn.listening{background:var(--coral); color:var(--white);}
  .mic-btn svg{width:19px; height:19px;}

  .cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .cat-card{background:var(--white); border:2px solid var(--border); border-radius:14px; padding:16px 8px; text-align:center; font-size:0.82rem; font-weight:700; color:var(--ink);}
  .cat-card .emoji{font-size:1.5rem; display:block; margin-bottom:6px;}
  .cat-card.selected{border-color:var(--teal); background:var(--teal-soft); color:var(--teal-dark);}
  @media (max-width:560px){.cat-grid{grid-template-columns:repeat(3,1fr);}}

  .chip-select{display:flex; flex-wrap:wrap; gap:10px;}
  .chip-opt{border:2px solid var(--teal-soft); background:var(--white); color:var(--teal-dark); border-radius:999px; padding:10px 18px; font-weight:600; font-size:0.85rem;}
  .chip-opt.selected{background:var(--teal); border-color:var(--teal); color:var(--white);}

  .meter-wrap{background:var(--border); border-radius:999px; height:10px; overflow:hidden; margin-top:6px;}
  .meter-fill{background:var(--teal); height:100%; transition:width 0.3s;}
  .meter-label{font-size:0.8rem; color:var(--ink-soft); font-weight:600; margin-top:6px;}

  /* ---- profile ---- */
  .profile-card{display:flex; gap:18px; align-items:flex-start;}
  .avatar{width:60px; height:60px; border-radius:50%; background:var(--gold-soft); display:flex; align-items:center; justify-content:center; flex:none;}
  .avatar svg{width:30px; height:30px; color:var(--teal-dark);}
  .profile-row{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border); font-size:0.9rem; gap:10px;}
  .profile-row:last-child{border-bottom:none;}
  .profile-row .k{color:var(--ink-soft); flex:none;}
  .profile-row .v{font-weight:600; color:var(--ink); text-align:right;}
  .tag-pill{display:inline-block; background:var(--teal-soft); color:var(--teal-dark); border-radius:999px; padding:5px 12px; font-size:0.75rem; font-weight:700; margin:2px 4px 2px 0;}

  /* ---- matching (loading) ---- */
  .match-loading{display:flex; flex-direction:column; align-items:center; text-align:center; padding:26px 0;}
  .spinner{width:56px; height:56px; border-radius:50%; border:5px solid var(--teal-soft); border-top-color:var(--teal); animation:spin 0.9s linear infinite; margin-bottom:20px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .checklist{text-align:left; margin-top:18px; display:flex; flex-direction:column; gap:10px; max-width:340px;}
  .checklist .item{display:flex; align-items:center; gap:10px; font-size:0.88rem; color:var(--ink-soft);}
  .checklist .item.done{color:var(--teal-dark); font-weight:600;}
  .checklist svg{width:18px; height:18px; flex:none; color:var(--border);}
  .checklist .item.done svg{color:var(--teal);}

  /* ---- results ---- */
  .demo-note{background:var(--gold-soft); border-radius:10px; padding:10px 14px; font-size:0.78rem; color:#7A5A2E; margin-bottom:18px;}
  .scheme-card{background:var(--white); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow);}
  .scheme-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px;}
  .scheme-name-wrap{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .scheme-name{font-family:'Baloo 2'; font-weight:700; font-size:1.05rem; color:var(--teal-dark);}
  .verified-pill{display:inline-flex; align-items:center; gap:4px; background:#E4F0EE; color:var(--teal); font-size:0.65rem; font-weight:700; padding:3px 8px; border-radius:999px;}
  .elig-pill{display:inline-flex; align-items:center; font-size:0.65rem; font-weight:700; padding:3px 9px; border-radius:999px;}
  .elig-pill.elig-yes{background:#E1F3EA; color:#1E7A4C;}
  .elig-pill.elig-maybe{background:var(--gold-soft); color:#7A5A2E;}
  .elig-pill.elig-no{background:#FBE7E1; color:var(--danger);}
  .verified-pill svg{width:11px; height:11px;}
  .match-badge{background:var(--teal); color:var(--white); border-radius:999px; padding:5px 12px; font-size:0.8rem; font-weight:700; flex:none;}
  .score-bars{display:flex; flex-direction:column; gap:8px; margin:12px 0;}
  .score-row{display:flex; align-items:center; gap:10px; font-size:0.75rem;}
  .score-row .slabel{width:96px; flex:none; color:var(--ink-soft); font-weight:600;}
  .score-row .sbar{flex:1; background:var(--teal-soft); border-radius:999px; height:7px; overflow:hidden;}
  .score-row .sfill{background:var(--aqua); height:100%;}
  .score-row .spct{width:32px; flex:none; text-align:right; font-weight:700; color:var(--teal-dark);}
  .why-toggle{background:none; border:none; color:var(--teal); font-weight:700; font-size:0.82rem; padding:6px 0; display:flex; align-items:center; gap:5px;}
  .why-toggle svg{width:14px; height:14px;}
  .why-panel{display:none; margin-top:10px; border-top:1px dashed var(--border); padding-top:12px;}
  .why-panel.open{display:block;}
  .factor-table{width:100%; border-collapse:collapse; font-size:0.8rem; margin-bottom:10px;}
  .factor-table td{padding:6px 4px; border-bottom:1px solid var(--border);}
  .factor-table td:last-child{text-align:right; font-weight:700;}
  .ai-explain{background:var(--teal-soft); border-radius:10px; padding:12px 14px; font-size:0.83rem; color:var(--teal-dark); font-style:italic;}
  .scheme-actions{display:flex; align-items:center; gap:14px; margin-top:12px; flex-wrap:wrap;}
  .save-toggle{display:flex; align-items:center; gap:6px; background:none; border:none; font-size:0.8rem; font-weight:600; color:var(--ink-soft);}
  .save-toggle svg{width:16px; height:16px;}
  .save-toggle.saved{color:var(--coral);}
  .compare-check{display:flex; align-items:center; gap:6px; font-size:0.8rem; font-weight:600; color:var(--ink-soft);}
  .compare-bar{position:sticky; bottom:70px; background:var(--teal-dark); color:var(--white); border-radius:14px; padding:12px 16px; display:none; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .compare-bar.show{display:flex;}
  .compare-bar .btn-primary{padding:9px 16px; font-size:0.8rem;}

  .compare-table-wrap{overflow-x:auto; margin-bottom:20px;}
  .compare-table{width:100%; border-collapse:collapse; font-size:0.82rem; background:var(--white); border-radius:12px; overflow:hidden;}
  .compare-table th, .compare-table td{padding:10px 12px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
  .compare-table th{background:var(--teal-soft); color:var(--teal-dark);}
  .best-pill{background:var(--coral); color:var(--white); border-radius:999px; padding:6px 14px; font-weight:700; font-size:0.82rem; display:inline-block; margin-bottom:20px;}

  /* ---- scheme detail ---- */
  .detail-section{margin-bottom:22px;}
  .detail-section h3{font-size:0.98rem; margin-bottom:10px;}
  .detail-list{list-style:none; display:flex; flex-direction:column; gap:8px;}
  .detail-list li{display:flex; gap:8px; font-size:0.88rem; color:var(--ink-soft);}
  .detail-list svg{width:16px; height:16px; color:var(--teal); flex:none; margin-top:3px;}
  .trust-box{display:flex; align-items:center; gap:12px; background:var(--teal-soft); border-radius:12px; padding:12px 16px; margin-bottom:22px;}
  .trust-box svg{width:22px; height:22px; color:var(--teal); flex:none;}
  .trust-box .t1{font-weight:700; font-size:0.85rem; color:var(--teal-dark);}
  .trust-box .t2{font-size:0.75rem; color:var(--ink-soft);}
  .app-process{display:flex; flex-direction:column; gap:0;}
  .ap-step{display:flex; gap:14px; align-items:flex-start;}
  .ap-step .apdot{width:26px; height:26px; border-radius:50%; background:var(--teal-soft); color:var(--teal-dark); font-size:0.72rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;}
  .ap-step .apbar{width:2px; flex:1; background:var(--border); margin:2px 0; min-height:20px; margin-left:12px;}
  .ap-step:last-child .apbar{display:none;}
  .ap-body{padding-bottom:16px; font-size:0.86rem; padding-top:2px;}

  .whatif-box{background:#FDF3E7; border:1px solid #F0DDBB; border-radius:14px; padding:18px; margin-top:8px;}
  .whatif-box h4{font-size:0.9rem; color:#7A5A2E; margin-bottom:8px;}
  .whatif-box ul{list-style:none; margin:10px 0; display:flex; flex-direction:column; gap:6px;}
  .whatif-box li{font-size:0.85rem; color:#7A5A2E; display:flex; gap:6px;}
  .whatif-result{background:var(--white); border-radius:10px; padding:12px 14px; font-size:0.85rem; margin-top:10px; color:var(--teal-dark); font-weight:700;}
  .calc-box{background:var(--teal-soft); border-radius:14px; padding:18px;}
  .calc-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .calc-row label{width:150px; flex:none; font-size:0.82rem; font-weight:600; color:var(--teal-dark);}
  .calc-row input{flex:1; border:1.5px solid #BFE0DA; border-radius:10px; padding:9px 12px; font-size:0.85rem; font-family:'Mukta'; background:var(--white);}
  .calc-result{background:var(--white); border-radius:10px; padding:12px 14px; margin-top:8px; font-weight:700; color:var(--teal-dark);}

  /* ---- roadmap ---- */
  .roadmap{display:flex; flex-direction:column; gap:0;}
  .rstep{display:flex; gap:16px;}
  .rstep .rline{display:flex; flex-direction:column; align-items:center;}
  .rstep .rdot{width:30px; height:30px; border-radius:50%; background:var(--teal-soft); color:var(--teal-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.8rem; flex:none;}
  .rstep.done .rdot{background:var(--teal); color:var(--white);}
  .rstep .rbar{width:2px; flex:1; background:var(--border); margin:4px 0; min-height:30px;}
  .rstep:last-child .rbar{display:none;}
  .rstep-body{padding-bottom:26px;}
  .rstep-body h4{font-size:0.94rem; color:var(--teal-dark); margin-bottom:4px;}
  .rstep-body p{font-size:0.82rem; color:var(--ink-soft);}
  .rstep-body .eta{font-size:0.72rem; color:var(--coral); font-weight:700; margin-top:4px;}

  /* ---- documents ---- */
  .doc-row{display:flex; align-items:flex-start; gap:14px; padding:16px 0; border-bottom:1px solid var(--border);}
  .doc-row:last-child{border-bottom:none;}
  .doc-icon{width:40px; height:40px; border-radius:10px; background:var(--teal-soft); display:flex; align-items:center; justify-content:center; flex:none;}
  .doc-icon svg{width:20px; height:20px; color:var(--teal-dark);}
  .doc-body{flex:1;}
  .doc-name{font-weight:700; font-size:0.92rem; margin-bottom:3px;}
  .doc-tip{font-size:0.78rem; color:var(--ink-soft); margin-bottom:8px;}
  .doc-upload{background:var(--teal-soft); color:var(--teal-dark); border:none; border-radius:10px; padding:8px 14px; font-weight:600; font-size:0.78rem;}
  .doc-upload.uploaded{background:var(--teal); color:var(--white);}
  .doc-progress-wrap{background:var(--border); border-radius:999px; height:8px; margin-bottom:12px; overflow:hidden;}
  .doc-progress{background:var(--teal); height:100%; transition:width 0.3s;}
  .doc-remaining{font-size:0.82rem; color:var(--coral); font-weight:700; margin-bottom:20px;}

  /* ---- dashboard ---- */
  .dash-greet{font-size:1.4rem; margin-bottom:20px;}
  .dash-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
  .dash-card{background:var(--white); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow);}
  .dash-card .num{font-family:'Baloo 2'; font-size:1.5rem; color:var(--teal-dark); font-weight:800;}
  .dash-card .lbl{font-size:0.72rem; color:var(--ink-soft); font-weight:600;}
  .status-pill{display:inline-block; border-radius:999px; padding:4px 12px; font-size:0.72rem; font-weight:700; background:var(--gold-soft); color:#7A5A2E;}
  @media (max-width:560px){.dash-grid{grid-template-columns:1fr 1fr;}}

  .dash-section{margin-bottom:26px;}
  .dash-section h3{font-size:1rem; margin-bottom:12px;}
  .alert-row{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border); font-size:0.85rem;}
  .alert-row:last-child{border-bottom:none;}
  .alert-row svg{width:18px; height:18px; color:var(--coral); flex:none; margin-top:2px;}
  .tracker-mini{display:flex; align-items:center; gap:6px; margin-top:10px;}
  .tracker-mini .tseg{flex:1; height:6px; border-radius:999px; background:var(--border);}
  .tracker-mini .tseg.on{background:var(--teal);}
  .tracker-mini-labels{display:flex; justify-content:space-between; font-size:0.7rem; color:var(--ink-soft); margin-top:4px;}

  .journey{display:flex; overflow-x:auto; gap:0; padding-bottom:8px;}
  .jstep{display:flex; flex-direction:column; align-items:center; flex:none; width:96px; text-align:center;}
  .jstep .jdot{width:38px; height:38px; border-radius:50%; background:var(--teal-soft); color:var(--teal-dark); display:flex; align-items:center; justify-content:center; font-size:1.1rem; margin-bottom:6px;}
  .jstep.current .jdot{background:var(--coral); color:var(--white);}
  .jstep .jl{font-size:0.72rem; font-weight:700; color:var(--ink-soft);}

/* ============ MATCHING LOGIC (transparent scoring, for explainability) ============ */
/* Weighted scoring, matching the specified formula:
   Business Match x30% + Location Match x20% + Business Stage x15% + Support Requirement x20% + Eligibility Match x15% */
var WEIGHTS = { biz:0.30, loc:0.20, stage:0.15, supp:0.20, elig:0.15 };

function computeMatches(){
  var p = state.profile;
  var scored = SCHEMES.map(function(s){
    var bizScore = 45, locScore = 45, stageScore = 60, suppScore = 45, eligScore = 40;
    var reasons = [];
    var factors = {biz:false, loc:false, stage:true, supp:false, elig:false};

    if (p.category && s.cat === p.category){
      bizScore = 95; factors.biz = true;
      reasons.push({en:"Your business type matches what this scheme is designed for.", hi:"आपका व्यापार प्रकार इस योजना के लिए उपयुक्त है।"});
    }
    if (p.location){
      locScore = 92; factors.loc = true;
      reasons.push({en:"Available in your area.", hi:"आपके क्षेत्र में उपलब्ध है।"});
    }
    if (p.stage){ stageScore = 88; }
    if (p.supportNeeded.length){
      suppScore = 90; factors.supp = true;
      reasons.push({en:"Matches the kind of support you said you need.", hi:"आपको चाहिए सहायता के प्रकार से मेल खाती है।"});
    }
    if (p.categories.indexOf(s.tag) !== -1){
      eligScore = 96; factors.elig = true;
      reasons.push({en:"You told us you're a " + STR.en.catLabels[s.tag].toLowerCase() + " — this scheme is built for that group.",
                     hi:"आपने बताया कि आप " + STR.hi.catLabels[s.tag] + " हैं — यह योजना इसी समूह के लिए बनी है।"});
    }

    var pct = Math.round(
      bizScore * WEIGHTS.biz + locScore * WEIGHTS.loc + stageScore * WEIGHTS.stage +
      suppScore * WEIGHTS.supp + eligScore * WEIGHTS.elig
    );

    var eligLabel = pct >= 75 ? "eligible" : pct >= 50 ? "possible" : "notyet";

    return { scheme:s, pct:pct, reasons:reasons, eligLabel:eligLabel,
      scores:{elig:eligScore, need:suppScore, loc:locScore, stage:stageScore, biz:bizScore}, factors:factors };
  });
  scored.sort(function(a,b){ return b.pct - a.pct; });
  return scored.slice(0,4);
}

   Partner data is fictional/demo — see PARTNERS above. */

    var serviceAreaScore = (p.stateName && partner.state === p.stateName) ? 95 : 50;
    var capacityScore = partner.capacity;

    var score = Math.round(
      compatScore * PARTNER_WEIGHTS.compat + proximityScore * PARTNER_WEIGHTS.proximity +
      routingScore * PARTNER_WEIGHTS.routing + serviceAreaScore * PARTNER_WEIGHTS.serviceArea +
      capacityScore * PARTNER_WEIGHTS.capacity
    );

    var eligible = partner.routingStatus !== "red" && partner.categoriesSupported.indexOf(scheme.categoryType) !== -1;

    var reasons = [];
    if (partner.categoriesSupported.indexOf(scheme.categoryType) !== -1){
      reasons.push(state.lang==="hi" ? "यह आपकी चुनी गई योजना श्रेणी का समर्थन करता है।" : "Supports your selected scheme category.");
    }
    if (p.stateName && partner.state === p.stateName){
      reasons.push(state.lang==="hi" ? "आपके क्षेत्र में सेवा देता है।" : "Serves your location.");
    }
    if (partner.routingStatus === "green"){
      reasons.push(state.lang==="hi" ? "फिलहाल रूटिंग के लिए पात्र है।" : "Currently eligible for routing.");
    }
    reasons.push((state.lang==="hi" ? "नज़दीकी: " : "Nearby: ") + partner.distanceKm + " km");

    return { partner:partner, score:score, eligible:eligible, reasons:reasons };
  });
  scored.sort(function(a,b){ return b.score - a.score; });
  return scored;
}

/* ============ RENDER: TRACKER ============ */
function renderTracker(){
  var el = document.getElementById("tracker");
  el.innerHTML = "";
  t("steps").forEach(function(label, i){
    var wrap = document.createElement("div");
    wrap.className = "tstep" + (i < state.step ? " done" : i === state.step ? " active" : "");
    wrap.innerHTML = '<span class="dot">'+(i+1)+'</span><span class="label">'+label+'</span>';
    el.appendChild(wrap);
    if (i < t("steps").length - 1){
      var line = document.createElement("div");
      line.className = "line";
      el.appendChild(line);
    }
  });
}

function renderCompareTable(){
  var ids = Object.keys(state.compareSelection).filter(function(k){ return state.compareSelection[k]; });
  var picks = state.matches.filter(function(m){ return ids.indexOf(m.scheme.id) !== -1; });
  if (!picks.length) return "";
  var best = picks.reduce(function(a,b){ return b.pct > a.pct ? b : a; });
  var html = '<h3 style="font-size:0.95rem;margin-bottom:10px;">'+t("compareTitle")+'</h3>';
  html += '<div class="compare-table-wrap"><table class="compare-table"><thead><tr><th></th>';
  picks.forEach(function(m){ html += '<th>'+m.scheme.name[state.lang]+'</th>'; });
  html += '</tr></thead><tbody>';
  html += '<tr><td>'+t("compareRows").match+'</td>'; picks.forEach(function(m){ html += '<td>'+m.pct+'%</td>'; }); html += '</tr>';
  html += '<tr><td>'+t("compareRows").funding+'</td>'; picks.forEach(function(m){ html += '<td>'+m.scheme.funding+'</td>'; }); html += '</tr>';
  html += '<tr><td>'+t("compareRows").training+'</td>'; picks.forEach(function(m){ html += '<td>'+(m.scheme.training?'✅':'❌')+'</td>'; }); html += '</tr>';
  html += '<tr><td>'+t("compareRows").location+'</td>'; picks.forEach(function(m){ html += '<td>'+m.scheme.location+'</td>'; }); html += '</tr>';
  html += '<tr><td>'+t("compareRows").mode+'</td>'; picks.forEach(function(m){ html += '<td>'+m.scheme.mode[state.lang]+'</td>'; }); html += '</tr>';
  html += '</tbody></table></div>';
  html += '<div class="best-pill">🏆 '+t("bestForYou")+': '+best.scheme.name[state.lang]+'</div>';
  return html;
}

function incomeIndicatorHtml(){
  if (state.income === null) return "";
  var lowestThreshold = Math.min.apply(null, SCHEMES.map(function(s){ return s.incomeThreshold; }));
  var eligible = state.income <= lowestThreshold;
  return '<span style="color:'+(eligible?'#1E7A4C':'#C2703A')+';">'+(eligible ? t("incomeEligibleGreen") : t("incomeEligibleOrange"))+'</span>';
}

function profileCompletionPct(){
  var p = state.profile;
  var fields = [p.category, p.location, p.stage, p.supportNeeded.length>0, p.description];
  var filled = fields.filter(Boolean).length;
  return Math.round((filled/5)*100);
}

function remainingDocsCount(scheme, docsList){
  if (!scheme || !docsList) return 0;
  var remaining = 0;
  docsList.forEach(function(d){ if (!state.docsUploaded[d]) remaining++; });
  return remaining;
}

// Illustrative-only: treats the scheme's demo "verified" date as if it were an
// application deadline, purely so the Smart Alerts card has a real number to
// compute from. Not a real deadline — the UI already labels it as illustrative.
function daysUntilDeadline(verifiedDateStr, addDays){
  if (!verifiedDateStr) return null;
  var parts = verifiedDateStr.split("/");
  if (parts.length !== 3) return null;
  var d = new Date(parts[2], parts[1]-1, parts[0]);
  d.setDate(d.getDate() + addDays);
  var diffMs = d.getTime() - Date.now();
  return Math.ceil(diffMs / (1000*60*60*24));
}

/* ============ EVENTS PER SCREEN ============ */
function wireScreenEvents(s){
  if (s === 0){
    var fb = document.getElementById("landingFindBtn"); if (fb) fb.addEventListener("click", function(){ state.step = 1; renderTracker(); renderScreen(); });
    var eb = document.getElementById("landingExploreBtn"); if (eb) eb.addEventListener("click", function(){ state.matches = computeMatches(); state.step = 4; renderTracker(); renderScreen(); });
  }

  if (s === 1){
    document.querySelectorAll(".cat-card").forEach(function(c){
      c.addEventListener("click", function(){ state.profile.category = c.getAttribute("data-cat"); renderScreen(); });
    });
    var locInput = document.getElementById("f_loc");
    if (locInput) locInput.addEventListener("input", function(){ state.profile.location = locInput.value; updateMeterLive(); });
    var stateSelect = document.getElementById("f_state");
    if (stateSelect) stateSelect.addEventListener("change", function(){
      state.profile.stateName = stateSelect.value;
      state.profile.district = "";
      renderScreen();
    });
    var districtSelect = document.getElementById("f_district");
    if (districtSelect) districtSelect.addEventListener("change", function(){
      state.profile.district = districtSelect.value;
      if (!state.profile.location) state.profile.location = districtSelect.value;
      updateMeterLive();
    });
    document.querySelectorAll(".mic-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ startMic(btn.getAttribute("data-mic"), btn); });
    });
    document.querySelectorAll("[data-stage]").forEach(function(c){
      c.addEventListener("click", function(){ state.profile.stage = c.getAttribute("data-stage"); renderScreen(); });
    });
    document.querySelectorAll("[data-support]").forEach(function(c){
      c.addEventListener("click", function(){
        var key = c.getAttribute("data-support");
        var idx = state.profile.supportNeeded.indexOf(key);
        if (idx === -1) state.profile.supportNeeded.push(key); else state.profile.supportNeeded.splice(idx,1);
        renderScreen();
      });
    });
    var descInput = document.getElementById("f_desc");
    if (descInput) descInput.addEventListener("input", function(){ state.profile.description = descInput.value; updateMeterLive(); });
    document.querySelectorAll("[data-audience]").forEach(function(chip){
      chip.addEventListener("click", function(){
        var key = chip.getAttribute("data-audience");
        var idx = state.profile.categories.indexOf(key);
        if (idx === -1) state.profile.categories.push(key); else state.profile.categories.splice(idx,1);
        chip.classList.toggle("selected");
      });
    });
    document.querySelectorAll("[data-budgetrange]").forEach(function(c){
      c.addEventListener("click", function(){ state.budgetRange = c.getAttribute("data-budgetrange"); renderScreen(); });
    });
    document.querySelectorAll("[data-revmodel]").forEach(function(c){
      c.addEventListener("click", function(){ state.revenueModel = c.getAttribute("data-revmodel"); renderScreen(); });
    });
    document.querySelectorAll("[data-growth]").forEach(function(c){
      c.addEventListener("click", function(){ state.growthGoal = c.getAttribute("data-growth"); renderScreen(); });
    });
    var incomeInput = document.getElementById("f_income");
    if (incomeInput) incomeInput.addEventListener("input", function(){
      var v = parseFloat(incomeInput.value.replace(/[^0-9.]/g, ""));
      state.income = v || null;
      var indicatorEl = document.getElementById("incomeIndicator");
      if (indicatorEl) indicatorEl.innerHTML = incomeIndicatorHtml();
    });
  }

  if (s === 3){
    var i = 0;
    var iv = setInterval(function(){
      var item = document.getElementById("mstep"+i);
      if (item) item.classList.add("done");
      i++;
      if (i >= STR.en.matchSteps.length){
        clearInterval(iv);
        state.matches = computeMatches();
        setTimeout(function(){ state.step = 4; renderTracker(); renderScreen(); }, 500);
      }
    }, 480);
  }

  if (s === 4){
    document.querySelectorAll("[data-open], [data-view]").forEach(function(elx){
      elx.addEventListener("click", function(){
        var id = elx.getAttribute("data-open") || elx.getAttribute("data-view");
        state.selectedScheme = SCHEMES.filter(function(sc){ return sc.id === id; })[0];
        state.step = 5; renderTracker(); renderScreen();
      });
    });
    document.querySelectorAll("[data-why]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-why");
        state.openWhy[id] = !state.openWhy[id];
        renderScreen();
      });
    });
    document.querySelectorAll("[data-save]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-save");
        state.savedSchemes[id] = !state.savedSchemes[id];
        renderScreen();
      });
    });
    document.querySelectorAll("[data-compare]").forEach(function(chk){
      chk.addEventListener("change", function(){
        state.compareSelection[chk.getAttribute("data-compare")] = chk.checked;
        renderScreen();
      });
    });
    var cmpBtn = document.getElementById("doCompareBtn");
    if (cmpBtn) cmpBtn.addEventListener("click", function(){ state.showCompare = true; renderScreen(); });
  }

  if (s === 5){
    var toggleBtn = document.getElementById("toggleAssumptions");
    if (toggleBtn) toggleBtn.addEventListener("click", function(){
      state.calcEditingAssumptions = !state.calcEditingAssumptions;
      renderScreen();
    });
    var moratSelect = document.getElementById("calcMorat");
    if (moratSelect) moratSelect.addEventListener("change", function(){
      state.calcMoratorium = parseInt(moratSelect.value, 10);
    });
    var calcBtn = document.getElementById("calcBtn");
    if (calcBtn) calcBtn.addEventListener("click", function(){
      var scNow = state.selectedScheme || (state.matches[0] && state.matches[0].scheme);
      var amount = parseFloat((document.getElementById("calcAmount").value || "").replace(/[^0-9.]/g, ""));
      var interestInput = document.getElementById("calcInterest");
      var tenureInput = document.getElementById("calcTenure");
      var interest = interestInput ? parseFloat(interestInput.value) : (state.calcInterest !== null ? state.calcInterest : scNow.interestRate);
      var tenure = tenureInput ? parseFloat(tenureInput.value) : (state.calcTenure !== null ? state.calcTenure : scNow.maxTenureMonths);
      var morat = state.calcMoratorium !== null ? state.calcMoratorium : (document.getElementById("calcMorat") ? parseInt(document.getElementById("calcMorat").value,10) : scNow.moratoriumOptions[0]);

      var resultEl = document.getElementById("calcResult");
      if (!amount || amount <= 0 || !interest || !tenure){
        resultEl.style.display = "block";
        resultEl.textContent = state.lang === "hi" ? "कृपया सही जानकारी डालें।" : "Please enter valid values.";
        return;
      }
      state.calcAmountVal = amount; state.calcInterest = interest; state.calcTenure = tenure; state.calcMoratorium = morat;

      var repaymentMonths = Math.max(1, tenure - morat);
      var rate = (interest/100) / 12;
      var emi = rate === 0 ? (amount / repaymentMonths) : (amount * rate * Math.pow(1+rate, repaymentMonths)) / (Math.pow(1+rate, repaymentMonths) - 1);
      var totalRepayment = emi * repaymentMonths;
      var totalInterest = totalRepayment - amount;
      var fmt = function(n){ return "₹" + Math.round(n).toLocaleString(state.lang==="hi"?"hi-IN":"en-IN"); };

      resultEl.style.display = "block";
      resultEl.innerHTML =
        '<div>'+t("calcResultLabel")+': '+fmt(emi)+' / '+(state.lang==="hi"?"माह":"month")+'</div>' +
        '<div style="margin-top:6px;">'+t("calcTotalInterest")+': '+fmt(totalInterest)+'</div>' +
        '<div style="margin-top:6px;">'+t("calcTotalRepayment")+': '+fmt(totalRepayment)+'</div>';
    });
  }

  if (s === 6){
    var useLocBtn = document.getElementById("partnerUseLocBtn");
    if (useLocBtn) useLocBtn.addEventListener("click", function(){ state.partnerSearched = true; renderScreen(); });
    var searchBtn = document.getElementById("partnerSearchBtn");
    if (searchBtn) searchBtn.addEventListener("click", function(){ state.partnerSearched = true; renderScreen(); });
    document.querySelectorAll("[data-selectpartner]").forEach(function(btn){
      btn.addEventListener("click", function(){ state.selectedPartner = btn.getAttribute("data-selectpartner"); renderScreen(); });
    });
    var bestBtn = document.getElementById("findBestPartnerBtn");
    if (bestBtn) bestBtn.addEventListener("click", function(){
      var scNow = state.selectedScheme || (state.matches[0] && state.matches[0].scheme);
      var scored = computePartnerScores(scNow).filter(function(p){ return p.eligible; });
      if (scored.length) state.selectedPartner = scored[0].partner.id;
      renderScreen();
    });
  }

  if (s === 7){
    var budgetBtn = document.getElementById("setBudgetBtn");
    if (budgetBtn) budgetBtn.addEventListener("click", function(){
      var v = parseFloat((document.getElementById("budgetInput").value || "").replace(/[^0-9.]/g, ""));
      if (!v || v <= 0) return;
      state.budget = v;
      state.allocation = Object.assign({}, BUSINESS_ALLOCATIONS[state.profile.category] || BUSINESS_ALLOCATIONS.other);
      renderScreen();
    });
    document.querySelectorAll("[data-slider]").forEach(function(slider){
      slider.addEventListener("input", function(){
        state.allocation[slider.getAttribute("data-slider")] = parseInt(slider.value, 10);
        renderScreen();
      });
    });
    var optBtn = document.getElementById("optimizeBudgetBtn");
    if (optBtn) optBtn.addEventListener("click", function(){
      var total = Object.keys(state.allocation).reduce(function(sum,k){ return sum + Number(state.allocation[k]); }, 0);
      if (total > 0){
        Object.keys(state.allocation).forEach(function(k){
          state.allocation[k] = Math.round(state.allocation[k] / total * 100);
        });
      }
      renderScreen();
    });
  }

  if (s === 8){
    var revCalcBtn = document.getElementById("revCalcBtn");
    if (revCalcBtn) revCalcBtn.addEventListener("click", function(){
      var price = parseFloat(document.getElementById("revPrice").value) || 0;
      var units = parseFloat(document.getElementById("revUnits").value) || 0;
      state.revPrice = price; state.revUnits = units;
      var resultEl = document.getElementById("revResult");
      resultEl.style.display = "block";
      resultEl.textContent = t("revResultLabel") + ": ₹" + Math.round(price*units).toLocaleString(state.lang==="hi"?"hi-IN":"en-IN");
    });

    var profitBtn = document.getElementById("profitCalcBtn");
    if (profitBtn) profitBtn.addEventListener("click", function(){
      var price = parseFloat(document.getElementById("revPrice").value) || state.revPrice || 0;
      var units = parseFloat(document.getElementById("revUnits").value) || state.revUnits || 0;
      var varCost = parseFloat(document.getElementById("profitVarCost").value) || 0;
      var fixedCost = parseFloat(document.getElementById("profitFixedCost").value) || 0;
      state.profitVarCost = varCost; state.profitFixedCost = fixedCost;
      var revenue = price * units;
      var varTotal = varCost * units;
      var surplus = revenue - varTotal - fixedCost;
      var contribution = price - varCost;
      var breakeven = contribution > 0 ? Math.ceil(fixedCost / contribution) : null;
      var fmt = function(n){ return "₹" + Math.round(n).toLocaleString(state.lang==="hi"?"hi-IN":"en-IN"); };
      document.getElementById("profitResult").innerHTML =
        '<div class="calc-result">'+t("profitRevenue")+': '+fmt(revenue)+'</div>' +
        '<div class="calc-result">'+t("profitVarCostTotal")+': '+fmt(varTotal)+'</div>' +
        '<div class="calc-result">'+t("profitFixedCostTotal")+': '+fmt(fixedCost)+'</div>' +
        '<div class="calc-result" style="color:'+(surplus>=0?'var(--teal-dark)':'var(--danger)')+';">'+t("profitSurplus")+': '+fmt(surplus)+'</div>' +
        '<div class="calc-result">'+t("profitBreakeven")+': '+(breakeven!==null ? breakeven+' '+t("profitBreakevenUnits") : "—")+'</div>';
    });

    document.querySelectorAll("[data-whatifchip]").forEach(function(chip){
      chip.addEventListener("click", function(){

        var basePrice = state.revPrice || parseFloat(document.getElementById("revPrice").value) || 100;
        var baseUnits = state.revUnits || parseFloat(document.getElementById("revUnits").value) || 1000;
        var newPrice = basePrice, newUnits = baseUnits, note = "";
        if (key === "price"){ newPrice = Math.round(basePrice * 1.1); }
        if (key === "units"){ newUnits = baseUnits + 500; }
        if (key === "cost"){ note = state.lang==="hi" ? "(लागत घटाने का असर आपके लाभ पर सीधे पड़ता है — ऊपर लाभ सिम्युलेटर में परिवर्तनीय लागत घटाकर देखें)" : "(reducing cost affects your profit directly — try lowering variable cost above in the Profit Simulator)"; }
        var revenueA = basePrice * baseUnits;
        var revenueB = newPrice * newUnits;
        var fmt = function(n){ return "₹" + Math.round(n).toLocaleString(state.lang==="hi"?"hi-IN":"en-IN"); };
        document.getElementById("scenarioCompare").innerHTML =
          '<div class="calc-row"><label>'+t("scenarioA")+'</label><span>'+fmt(revenueA)+'</span></div>' +
          '<div class="calc-row"><label>'+t("scenarioB")+'</label><span>'+fmt(revenueB)+'</span></div>' +
          '<div class="calc-result">'+t("scenarioDiff")+': '+fmt(revenueB-revenueA)+'</div>' +
          (note ? '<p class="fine" style="color:var(--ink-soft); margin-top:6px;">'+note+'</p>' : '');
      });
    });
  }

  if (s === 10){
    document.querySelectorAll(".doc-upload").forEach(function(btn){
      btn.addEventListener("click", function(){
        var d = btn.getAttribute("data-doc");

        if (state.docsUploaded[d]) return;

        // Create a temporary file input so the user can actually choose a file.
        var fileInput = document.createElement("input");

        fileInput.accept = ".pdf,.jpg,.jpeg,.png,.webp";
        fileInput.style.display = "none";

          }

          // Remove the temporary input from the page.
          if (fileInput.parentNode) fileInput.parentNode.removeChild(fileInput);
        });
      });
    });
    var pcb = document.getElementById("prepareChecklistBtn");
    if (pcb) pcb.addEventListener("click", function(){ state.step = 11; renderTracker(); renderScreen(); });
  }

  if (s === 11){
    var c = document.getElementById("dashContinue"); if (c) c.addEventListener("click", function(){ state.step = 9; renderTracker(); renderScreen(); });
    var ex = document.getElementById("dashExplore"); if (ex) ex.addEventListener("click", function(){ state.step = 4; renderTracker(); renderScreen(); });
    var ed = document.getElementById("dashEdit"); if (ed) ed.addEventListener("click", function(){ state.step = 2; renderTracker(); renderScreen(); });
    var mrb = document.getElementById("mentorRequestBtn");
    if (mrb) mrb.addEventListener("click", function(){
      var name = document.getElementById("mentorName").value.trim();
      if (!name) { document.getElementById("mentorName").focus(); return; }
      state.mentorRequestSent = true;
      renderScreen();
    });
    var dpb = document.getElementById("dashPlanBudget");
    if (dpb) dpb.addEventListener("click", function(){ state.step = 7; renderTracker(); renderScreen(); });
  }
}

function updateMeterLive(){
  var pct = profileCompletionPct();
  var fill = document.querySelector(".meter-fill");
  var label = document.querySelector(".meter-label");
  if (fill) fill.style.width = pct + "%";
  if (label) label.textContent = pct + "%";
}

/* ============ VOICE INPUT ============ */
var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
function startMic(fieldId, btn){
  if (!Recognition){ alert(state.lang==="hi" ? "इस डिवाइस पर आवाज़ इनपुट उपलब्ध नहीं है।" : "Voice input isn't supported on this device."); return; }
  var rec = new Recognition();
  rec.lang = state.lang === "hi" ? "hi-IN" : "en-IN";
  rec.onresult = function(e){
    var text = e.results[0][0].transcript;
    var input = document.getElementById(fieldId);
    if (input){
      input.value = text;
      if (fieldId==="f_loc") state.profile.location = text;
      updateMeterLive();
    }
    btn.classList.remove("listening");
  };
  rec.onerror = function(){ btn.classList.remove("listening"); };
  rec.onend = function(){ btn.classList.remove("listening"); };
  btn.classList.add("listening");
  try { rec.start(); } catch(e){ btn.classList.remove("listening"); }
}

/* ============ NAV ============ */
function updateNavButtons(){
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  backBtn.style.visibility = state.step === 0 ? "hidden" : "visible";
  backBtn.textContent = t("back");

  if (state.step === 0) nextBtn.textContent = t("getStarted");
  else if (state.step === 1) nextBtn.textContent = t("analyzeBtn");
  else if (state.step === 11) nextBtn.textContent = t("finish");
  else nextBtn.textContent = t("next");

  nextBtn.style.display = (state.step === 0 || state.step === 3) ? "none" : "inline-flex";

  var valid = true;
  if (state.step === 1) valid = !!(state.profile.category && state.profile.location.trim());
  nextBtn.disabled = !valid;
}

document.getElementById("backBtn").addEventListener("click", function(){
  if (state.step > 0){
    state.step -= 1;
    if (state.step === 3) state.step = 2;
    renderTracker(); renderScreen();
  }
});
document.getElementById("nextBtn").addEventListener("click", function(){
  if (state.step === 11){ renderScreen(); return; }
  state.step += 1;
  renderTracker(); renderScreen();
  saveProfileToSupabase(); // no-op if not signed in
});

document.querySelectorAll(".lang-switch button").forEach(function(btn){
  btn.addEventListener("click", function(){
    state.lang = btn.getAttribute("data-lang");
    document.querySelectorAll(".lang-switch button").forEach(function(b){ b.classList.toggle("active", b===btn); });
    renderAccessibilityLabels();
    if (typeof renderLoginButton === "function") renderLoginButton();
    renderTracker(); renderScreen();
  });
});

/* ============ REAL EMAIL/PASSWORD AUTH (Supabase Auth + profiles table) ============ */
// The anon key below is safe to expose in front-end code by design — Supabase
// enforces access with Row Level Security (see supabase/schema.sql), not by
// keeping this key secret. Never put your service_role key here.
var SUPABASE_URL = "https://buzqsyrwhwjjfgusmdlt.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_WvmGnTzx-Tu0M5-jIWcWbw_TDyZmzAs";
var supabaseClient = (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

state.loggedIn = false;
state.loginEmail = "";
state.userId = null;
state.loginMode = "in"; // "in" = sign in, "up" = create account

var loginBtn = document.getElementById("loginBtn");
var loginPanel = document.getElementById("loginPanel");
var loginStepForm = document.getElementById("loginStepForm");
var loginStepDone = document.getElementById("loginStepDone");
var loginEmailInput = document.getElementById("loginEmailInput");
var loginPasswordInput = document.getElementById("loginPasswordInput");
var loginErrorNote = document.getElementById("loginErrorNote");
var loginSubmitBtn = document.getElementById("loginSubmitBtn");
var loginModeToggle = document.getElementById("loginModeToggle");

loginBtn.addEventListener("click", function(){ loginPanel.classList.toggle("open"); });
document.addEventListener("click", function(e){
  if (!loginPanel.contains(e.target) && e.target !== loginBtn && !loginBtn.contains(e.target)) loginPanel.classList.remove("open");
});

loginModeToggle.addEventListener("click", function(e){
  e.preventDefault();
  state.loginMode = state.loginMode === "in" ? "up" : "in";
  loginErrorNote.textContent = "";
  renderLoginButton();
});

loginSubmitBtn.addEventListener("click", function(){
  if (!supabaseClient){
    loginErrorNote.textContent = "Supabase isn't configured for this deployment.";
    return;
  }
  var email = loginEmailInput.value.trim();
  var password = loginPasswordInput.value;
  if (!email || !password || password.length < 6){
    loginErrorNote.textContent = t("loginErrGeneric");
    return;
  }
  loginErrorNote.textContent = "";
  loginSubmitBtn.disabled = true;

  var action = state.loginMode === "up"
    ? supabaseClient.auth.signUp({ email: email, password: password })
    : supabaseClient.auth.signInWithPassword({ email: email, password: password });

  action.then(function(result){
    loginSubmitBtn.disabled = false;
    if (result.error){
      loginErrorNote.textContent = result.error.message || t("loginErrGeneric");
      return;
    }
    if (state.loginMode === "up" && result.data && result.data.user && !result.data.session){
      loginErrorNote.textContent = t("loginErrConfirm");
      return;
    }
    onAuthSuccess(result.data.user, result.data.session);
  }).catch(function(){
    loginSubmitBtn.disabled = false;
    loginErrorNote.textContent = t("loginErrGeneric");
  });
});

document.getElementById("loginSignOutBtn").addEventListener("click", function(){
  if (supabaseClient) supabaseClient.auth.signOut();
  state.loggedIn = false;
  state.loginEmail = "";
  state.userId = null;
  loginEmailInput.value = "";
  loginPasswordInput.value = "";
  loginStepDone.style.display = "none";
  loginStepForm.style.display = "block";
  loginPanel.classList.remove("open");
  renderLoginButton();
});

function onAuthSuccess(user, session){
  state.loggedIn = true;
  state.loginEmail = user.email;
  state.userId = user.id;
  loginStepForm.style.display = "none";
  loginStepDone.style.display = "block";
  document.getElementById("loginWelcomeText").textContent = (state.lang === "hi" ? "स्वागत है, " : "Welcome, ") + state.loginEmail;
  renderLoginButton();
  loadProfileFromSupabase();
}

function profileRowFromState(){
  return {
    id: state.userId,
    category: state.profile.category || null,
    state_name: state.profile.stateName || null,
    district: state.profile.district || null,
    stage: state.profile.stage || null,
    support_needed: state.profile.supportNeeded || [],
    description: state.profile.description || null,
    audience_categories: state.profile.categories || [],
    budget_range: state.budgetRange || null,
    revenue_model: state.revenueModel || null,
    growth_goal: state.growthGoal || null,
    income: state.income,
    language: state.lang,
    updated_at: new Date().toISOString()
  };
}

function saveProfileToSupabase(){
  if (!supabaseClient || !state.loggedIn || !state.userId) return;
  supabaseClient.from("profiles").upsert(profileRowFromState()).then(function(result){
    if (result.error) console.warn("Profile save failed:", result.error.message);
  });
}

function loadProfileFromSupabase(){
  if (!supabaseClient || !state.userId) return;
  supabaseClient.from("profiles").select("*").eq("id", state.userId).maybeSingle().then(function(result){
    if (result.error || !result.data) return;
    var p = result.data;
    if (p.category) state.profile.category = p.category;
    if (p.state_name) state.profile.stateName = p.state_name;
    if (p.district) state.profile.district = p.district;
    if (p.stage) state.profile.stage = p.stage;
    if (p.support_needed) state.profile.supportNeeded = p.support_needed;
    if (p.description) state.profile.description = p.description;
    if (p.audience_categories) state.profile.categories = p.audience_categories;
    if (p.budget_range) state.budgetRange = p.budget_range;
    if (p.revenue_model) state.revenueModel = p.revenue_model;
    if (p.growth_goal) state.growthGoal = p.growth_goal;
    if (p.income != null) state.income = p.income;
    renderTracker(); renderScreen();
  });
}

function renderLoginButton(){
  loginBtn.textContent = state.loggedIn ? "✓ " + (state.loginEmail || "") : t("loginBtn");
  document.getElementById("loginPanelTitle").textContent = state.loginMode === "up" ? t("loginTitleUp") : t("loginTitleIn");
  document.getElementById("loginFormNote").textContent = state.loginMode === "up" ? t("loginFormNoteUp") : t("loginFormNoteIn");
  loginSubmitBtn.textContent = state.loginMode === "up" ? t("loginSubmitUp") : t("loginSubmitIn");
  loginModeToggle.textContent = state.loginMode === "up" ? t("loginToggleToIn") : t("loginToggleToUp");
  loginEmailInput.placeholder = t("loginEmailPh");
  loginPasswordInput.placeholder = t("loginPasswordPh");
  document.getElementById("loginSignOutBtn").textContent = t("loginSignOut");
}
renderLoginButton();

if (supabaseClient){
  supabaseClient.auth.getSession().then(function(result){
    var session = result.data && result.data.session;
    if (session && session.user) onAuthSuccess(session.user, session);
  });
}

function renderAccessibilityLabels(){
  var labels = state.lang === "hi"
    ? {title:"सुगमता", large:"बड़ा टेक्स्ट", contrast:"उच्च कंट्रास्ट", read:"यह पृष्ठ सुनें"}
    : {title:"Accessibility", large:"Larger text", contrast:"High contrast", read:"Read this page"};
  document.getElementById("a11yTitle").textContent = labels.title;
  document.getElementById("a11yLarge").textContent = labels.large;
  document.getElementById("a11yContrast").textContent = labels.contrast;
  document.getElementById("a11yRead").textContent = labels.read;
}
